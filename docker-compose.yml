services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tricon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tricon
      POSTGRES_PASSWORD: tricon
      POSTGRES_DB: tricon_it_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tricon -d tricon_it_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tricon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
