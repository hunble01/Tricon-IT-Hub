# Production stack for Tricon IT Hub — single VPS, fully self-contained.
#
# Designed to COEXIST with other apps on the same host:
#   - Only Caddy publishes a host port (8080 here — 80/443 belong to revoai on
#     this VPS). Postgres, Redis, API, and Web are reachable ONLY on the private
#     `tricon-net` network — they publish nothing, so they can't collide.
#   - All containers + volumes are namespaced `tricon-*`.
#
# Bring up:   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# (If you later get a domain / own 80/443, see DEPLOY.md → "Behind an existing proxy".)

name: tricon-it-hub

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tricon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tricon_pg_data:/var/lib/postgresql/data
    networks: [tricon-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tricon-redis
    restart: unless-stopped
    volumes:
      - tricon_redis_data:/data
    networks: [tricon-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations, then exit. API waits for this to finish.
  # Reuses the image built by the `api` service (same Dockerfile) — must NOT
  # declare its own build, or buildx races `api` exporting the same tag.
  migrate:
    image: tricon-it-hub-api:latest
    container_name: tricon-migrate
    command: ["pnpm", "--filter", "@tricon/db", "exec", "prisma", "migrate", "deploy"]
    working_dir: /app
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tricon-net]
    restart: "no"

  api:
    image: tricon-it-hub-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tricon-api
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [tricon-net]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: tricon-it-hub-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time — the PUBLIC origin.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN}
        NEXT_PUBLIC_AUTH_DISABLED: ${NEXT_PUBLIC_AUTH_DISABLED:-false}
    container_name: tricon-web
    restart: unless-stopped
    depends_on:
      - api
    networks: [tricon-net]

  caddy:
    image: caddy:2-alpine
    container_name: tricon-caddy
    restart: unless-stopped
    # 80/443 belong to another app (revoai) on this host. Publish the hub's
    # Caddy on a spare host port instead; it still listens on :80 internally.
    ports:
      - "8080:80"
    environment:
      # hub.example.com → auto-HTTPS. ":80" → plain HTTP (IP-only, no domain).
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tricon_caddy_data:/data
      - tricon_caddy_config:/config
    depends_on:
      - web
      - api
    networks: [tricon-net]

networks:
  tricon-net:
    name: tricon-net

volumes:
  tricon_pg_data:
  tricon_redis_data:
  tricon_caddy_data:
  tricon_caddy_config:
